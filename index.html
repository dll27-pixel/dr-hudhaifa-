<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عيادة المصارف</title>
<style>
:root{--bg:#071624;--pn:#0e1d2f;--bd:#1e3a5a;--pr:#00b48a;--bl:#38bdf8;--rd:#ef4444;--gd:#f59e0b;--tx:#f8fafc;--dm:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,'Segoe UI',Tahoma,sans-serif}
body{background:var(--bg);color:var(--tx);min-height:100vh}
button{cursor:pointer;font-weight:700}
.btn{background:#122336;color:#fff;border:1px solid var(--bd);padding:8px 12px;border-radius:9px;font-size:.8rem}
.btn:hover{border-color:var(--bl)}.btn.p{background:var(--pr);color:#04141d;border:0}.btn.d{background:var(--rd);border:0}
.in{background:#06101c;border:1px solid var(--bd);color:#fff;padding:9px 12px;border-radius:9px;font-size:.85rem;width:100%}
.in:focus{outline:0;border-color:var(--pr)}
#login{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--pn);border:1px solid var(--bd);border-radius:18px;padding:26px;width:100%;max-width:400px;text-align:center;display:flex;flex-direction:column;gap:10px}
header{background:var(--pn);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:20}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#08121d}
nav button{background:0;border:1px solid transparent;color:var(--dm);padding:8px 14px;border-radius:10px;white-space:nowrap}
nav button.on{color:#fff;border-color:var(--pr);background:rgba(0,180,138,.2)}
main{padding:16px;max-width:1200px;margin:auto}
.tab{display:none}.tab.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:12px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.stat{border-right:4px solid var(--pr)}.stat h2{font-size:1.5rem;color:var(--pr)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}.dm{color:var(--dm);font-size:.75rem}
.tag{font-size:.7rem;padding:2px 8px;border-radius:12px;border:1px solid var(--bd)}
.warn{background:rgba(239,68,68,.15);color:#fca5a5;border-color:var(--rd)}
.ok{background:rgba(0,180,138,.15);color:var(--pr);border-color:var(--pr)}
.arch{display:flex;justify-content:center;gap:3px;margin:12px 0;direction:ltr;flex-wrap:wrap}
.tooth{width:34px;height:46px;border-radius:8px 8px 14px 14px;background:linear-gradient(#fff,#cbd5e1);color:#0f172a;font-size:.7rem;font-weight:800;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;cursor:pointer;border:2px solid transparent;transition:.2s}
.tooth:hover{transform:translateY(-4px);border-color:var(--bl)}
.tooth.endo{background:linear-gradient(#f87171,#dc2626);color:#fff}.tooth.fill{background:linear-gradient(#38bdf8,#0284c7);color:#fff}
.tooth.crown{background:linear-gradient(#fbbf24,#d97706)}.tooth.implant{background:linear-gradient(#a855f7,#7e22ce);color:#fff}
.tooth.ext{opacity:.3;text-decoration:line-through}
#modal{position:fixed;inset:0;background:rgba(3,8,17,.85);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#mc{background:#0f1c2d;border:1px solid var(--bd);border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
#mh{padding:12px 16px;display:flex;justify-content:space-between;font-weight:900;border-bottom:1px solid var(--bd)}
#mb{padding:16px;display:flex;flex-direction:column;gap:10px}
label{font-size:.78rem;font-weight:700;color:var(--dm)}
.blur .money{filter:blur(8px)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--pr);color:#04141d;padding:10px 20px;border-radius:10px;font-weight:800;display:none;z-index:99}
#prn{display:none}
@media print{body>*:not(#prn){display:none!important}#prn{display:block;background:#fff;color:#000;padding:24px}#prn *{color:#000}}
</style>
</head>
<body>

<div id="login"><div class="box">
<h2>🦷 عيادة المصارف</h2><p style="color:var(--bl);font-weight:700">الدكتور حذيفة الحمداني</p>
<input type="password" id="pin" class="in" placeholder="رمز الطبيب" style="text-align:center;letter-spacing:4px">
<button class="btn p" onclick="login('doc')">دخول الطبيب / المدير</button>
<button class="btn" onclick="login('staff')">دخول السكرتارية</button>
<div id="perr" class="dm" style="color:var(--rd)"></div>
<div class="dm">الرمز الافتراضي عند أول تشغيل: 1992 (يمكن تغييره من تبويب الإعدادات)</div>
</div></div>

<header>
<b>🦷 عيادة المصارف <span class="tag ok" id="role"></span></b>
<div class="row"><button class="btn p" onclick="ptForm()">➕ مراجع جديد</button><button class="btn p" onclick="appForm()">📅 حجز موعد</button><button class="btn" onclick="logout()">خروج</button></div>
</header>
<nav id="nav"></nav>

<main>
<section class="tab on" id="t-home"></section>
<section class="tab" id="t-pts"><div class="row sp"><input id="q" class="in" style="max-width:320px" placeholder="🔍 اسم أو هاتف..." oninput="rPts()"><button class="btn" onclick="exportCsv()">📊 تصدير CSV</button></div><div class="grid" id="ptsBox"></div></section>
<section class="tab" id="t-apps"><div class="row sp"><input type="date" id="af" class="in" style="max-width:200px" onchange="rApps()"><button class="btn" onclick="speak()">🔊 نطق مواعيد اليوم</button></div><div id="appsBox" class="grid"></div></section>
<section class="tab" id="t-chart"><div class="row"><select id="cpt" class="in" style="max-width:300px" onchange="rChart()"></select><span class="dm">اضغط على السن لتسجيل الإجراء</span></div><div class="card" style="margin-top:12px"><div class="dm">الفك العلوي</div><div class="arch" id="up"></div><div class="arch" id="lo"></div><div class="dm">الفك السفلي</div></div><div id="chartLog" class="card" style="margin-top:12px"></div></section>
<section class="tab" id="t-fin"><div class="row sp"><h3>المالية</h3><button class="btn" onclick="document.getElementById('t-fin').classList.toggle('blur')">👁️ إخفاء/إظهار</button></div><div class="grid" id="finStats"></div><div class="grid" id="finList"></div></section>
<section class="tab" id="t-docs"><div class="row sp"><h3>كادر الأطباء (حتى 10)</h3><button class="btn p" onclick="docForm()">➕ طبيب</button></div><div class="grid" id="docBox"></div></section>
<section class="tab" id="t-set"><div class="card" style="max-width:460px"><h3>الإعدادات</h3>
<label>تغيير رمز الطبيب</label><input id="npin" type="password" class="in" placeholder="رمز جديد (4 أرقام على الأقل)"><button class="btn p" onclick="chgPin()">حفظ الرمز</button>
<hr style="border-color:var(--bd)"><button class="btn" onclick="backup()">💾 نسخة احتياطية</button>
<label>استعادة نسخة</label><input type="file" accept=".json" class="in" onchange="restore(event)"></div></section>
</main>

<div id="modal"><div id="mc"><div id="mh"><span id="mt"></span><button class="btn" onclick="closeM()">✕</button></div><div id="mb"></div></div></div>
<div id="toast"></div><div id="prn"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='masarif_v2',uid=()=>Math.random().toString(36).slice(2,9),fm=n=>Number(n||0).toLocaleString('en-US')+' د.ع';
const today=()=>new Date().toISOString().slice(0,10);
let db=JSON.parse(localStorage.getItem(K)||'null')||{patients:[],doctors:[{id:'d1',name:'د. حذيفة الحمداني',spec:'طب وجراحة الأسنان'}],apps:[],pays:[],pin:null};
let role=null,curPt=null;
const save=()=>localStorage.setItem(K,JSON.stringify(db));
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
async function sha(s){try{return [...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){return 'p'+s}}
const doc=id=>db.doctors.find(d=>d.id===id)||{name:'—'};
const pt=id=>db.patients.find(p=>p.id===id);
const paid=id=>db.pays.filter(x=>x.pt===id).reduce((a,b)=>a+b.amt,0);
const debt=p=>Math.max(0,(+p.cost||0)-paid(p.id));

/* ===== الدخول ===== */
async function login(r){
 if(r==='doc'){
  if(!db.pin){db.pin=await sha('1992');save()}
  if(await sha($('pin').value)!==db.pin){$('perr').textContent='⚠️ الرمز غير صحيح';return}
 }
 role=r;$('login').style.display='none';$('pin').value='';$('perr').textContent='';
 $('role').textContent=r==='doc'?'المدير':'سكرتارية';
 const tabs=[['home','🏠 الرئيسية'],['pts','👥 المراجعين'],['apps','📅 المواعيد'],['chart','🦷 مخطط الأسنان']];
 if(r==='doc')tabs.push(['fin','💰 المالية'],['docs','👨‍⚕️ الكادر'],['set','⚙️ الإعدادات']);
 $('nav').innerHTML=tabs.map(t=>`<button onclick="go('${t[0]}',this)">${t[1]}</button>`).join('');
 $('nav').firstChild.classList.add('on');go('home');
}
function logout(){role=null;$('login').style.display='flex'}
function go(t,b){
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));$('t-'+t).classList.add('on');
 if(b){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
 ({home:rHome,pts:rPts,apps:rApps,chart:rChart,fin:rFin,docs:rDocs,set:()=>{}})[t]();
}
function openM(t,h){$('mt').textContent=t;$('mb').innerHTML=h;$('modal').style.display='flex'}
function closeM(){$('modal').style.display='none'}
const docOpts=sel=>db.doctors.map(d=>`<option value="${d.id}" ${d.id===sel?'selected':''}>${esc(d.name)}</option>`).join('');

/* ===== الرئيسية ===== */
function rHome(){
 const t=today(),m=t.slice(0,7);
 const inc=(f)=>db.pays.filter(f).reduce((a,b)=>a+b.amt,0);
 const td=db.apps.filter(a=>a.date===t&&a.st!=='ملغي');
 const stats=[['مواعيد اليوم',td.length],['إجمالي المراجعين',db.patients.length]];
 if(role==='doc')stats.push(['دخل اليوم',fm(inc(x=>x.date===t))],['دخل الشهر',fm(inc(x=>x.date.startsWith(m)))],['إجمالي الديون',fm(db.patients.reduce((a,p)=>a+debt(p),0))]);
 $('t-home').innerHTML=`<div class="grid">${stats.map(s=>`<div class="card stat"><span class="dm">${s[0]}</span><h2>${s[1]}</h2></div>`).join('')}</div>
 <h3 style="margin:16px 0 6px">مواعيد اليوم</h3><div class="grid">${td.sort((a,b)=>a.time.localeCompare(b.time)).map(appCard).join('')||'<div class="dm">لا توجد مواعيد اليوم</div>'}</div>`;
}

/* ===== المراجعون ===== */
function rPts(){
 const q=($('q').value||'').trim().toLowerCase();
 const l=db.patients.filter(p=>p.name.toLowerCase().includes(q)||p.phone.includes(q));
 $('ptsBox').innerHTML=l.map(p=>`<div class="card"><div class="row sp"><b>${esc(p.name)}</b><span class="dm">${esc(p.age)} سنة</span></div>
 <div class="dm">📞 ${esc(p.phone)} · 📍 ${esc(p.address)} · 👨‍⚕️ ${esc(doc(p.doc).name)}</div>
 ${p.allergy?`<span class="tag warn">⚠️ حساسية: ${esc(p.allergy)}</span>`:''}
 ${role==='doc'?`<div class="row sp"><span class="tag">الكلفة ${fm(p.cost)}</span>${debt(p)?`<span class="tag warn">متبقي ${fm(debt(p))}</span>`:'<span class="tag ok">مسدد</span>'}</div>`:''}
 <div class="row"><button class="btn" onclick="ptForm('${p.id}')">تعديل</button><button class="btn" onclick="appForm('${p.id}')">حجز</button>
 ${role==='doc'?`<button class="btn" onclick="payForm('${p.id}')">دفعة</button>`:''}
 <button class="btn" onclick="medForm('${p.id}')">وصفة</button><button class="btn" onclick="goChart('${p.id}')">الأسنان</button>
 <button class="btn" onclick="printRx('${p.id}')">🖨</button>${role==='doc'?`<button class="btn d" onclick="delPt('${p.id}')">حذف</button>`:''}</div></div>`).join('')||'<div class="dm">لا يوجد مراجعون</div>';
}
function ptForm(id){
 const p=id?pt(id):{name:'',age:'',phone:'',address:'',doc:db.doctors[0].id,cost:0,allergy:'',notes:''};
 openM(id?'تعديل مراجع':'مراجع جديد',`
 <input id="f1" class="in" placeholder="الاسم الكامل" value="${esc(p.name)}">
 <div class="row"><input id="f2" type="number" class="in" style="flex:1" placeholder="العمر" value="${esc(p.age)}"><input id="f3" type="tel" class="in" style="flex:1" placeholder="الهاتف" value="${esc(p.phone)}"></div>
 <input id="f4" class="in" placeholder="العنوان" value="${esc(p.address)}">
 <label>الطبيب المعالج</label><select id="f5" class="in">${docOpts(p.doc)}</select>
 ${role==='doc'?`<label>كلفة العلاج الإجمالية (د.ع)</label><input id="f6" type="number" class="in" value="${p.cost}">`:''}
 <input id="f7" class="in" placeholder="الحساسية (بنسلين، بروفين، سلفا...)" value="${esc(p.allergy)}" style="border-color:var(--rd)">
 <textarea id="f8" class="in" rows="3" placeholder="ملاحظات وتشخيص">${esc(p.notes)}</textarea>
 <button class="btn p" onclick="savePt('${id||''}')">حفظ</button>`);
}
function savePt(id){
 const n=$('f1').value.trim(),ph=$('f3').value.trim();
 if(!n||!ph)return toast('الاسم والهاتف مطلوبان');
 const o={name:n,age:$('f2').value,phone:ph,address:$('f4').value,doc:$('f5').value,allergy:$('f7').value.trim(),notes:$('f8').value};
 if(id){const p=pt(id);Object.assign(p,o);if($('f6'))p.cost=+$('f6').value||0}
 else db.patients.push({id:uid(),...o,cost:$('f6')?+$('f6').value||0:0,teeth:{},meds:[]});
 save();closeM();rPts();toast('تم الحفظ');
}
function delPt(id){if(!confirm('حذف المراجع وكل مواعيده ومدفوعاته؟'))return;
 db.patients=db.patients.filter(p=>p.id!==id);db.apps=db.apps.filter(a=>a.pt!==id);db.pays=db.pays.filter(x=>x.pt!==id);save();rPts()}

/* ===== المواعيد ===== */
function appCard(a){
 const p=pt(a.pt);if(!p)return '';
 const cls=a.st==='ملغي'?'warn':a.st==='حضر'?'ok':'';
 return `<div class="card"><div class="row sp"><b>⏰ ${a.time} — ${esc(p.name)}</b><span class="tag ${cls}">${a.st}</span></div>
 <div class="dm">${esc(a.proc||'كشف')} · ${esc(doc(a.doc).name)} · ${a.date}</div>
 <div class="row"><button class="btn" onclick="setSt('${a.id}','حضر')">✔ حضر</button><button class="btn" onclick="setSt('${a.id}','ملغي')">✖ إلغاء</button>
 <button class="btn" onclick="waRemind('${a.id}')">💬 تذكير</button><button class="btn d" onclick="delApp('${a.id}')">حذف</button></div></div>`;
}
function rApps(){
 if(!$('af').value)$('af').value=today();
 const l=db.apps.filter(a=>a.date===$('af').value).sort((a,b)=>a.time.localeCompare(b.time));
 $('appsBox').innerHTML=l.map(appCard).join('')||'<div class="dm">لا توجد مواعيد في هذا اليوم</div>';
}
function appForm(pid){
 if(!db.patients.length)return toast('أضف مراجعاً أولاً');
 openM('حجز موعد',`<label>المراجع</label><select id="a1" class="in">${db.patients.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
 <label>الطبيب</label><select id="a2" class="in">${docOpts()}</select>
 <div class="row"><input type="date" id="a3" class="in" style="flex:1" value="${today()}" min="${today()}"><input type="time" id="a4" class="in" style="flex:1" step="900"></div>
 <input id="a5" class="in" placeholder="الإجراء (عصب، حشوة، كشف...)"><button class="btn p" onclick="saveApp()">تأكيد الحجز</button>`);
}
function saveApp(){
 const o={id:uid(),pt:$('a1').value,doc:$('a2').value,date:$('a3').value,time:$('a4').value,proc:$('a5').value,st:'محجوز'};
 if(!o.date||!o.time)return toast('حدد التاريخ والوقت');
 const toMin=t=>+t.slice(0,2)*60+ +t.slice(3);
 if(db.apps.some(a=>a.doc===o.doc&&a.date===o.date&&a.st!=='ملغي'&&Math.abs(toMin(a.time)-toMin(o.time))<30))
  return toast('⚠️ تعارض: للطبيب موعد قريب (أقل من 30 دقيقة)');
 db.apps.push(o);save();closeM();toast('تم الحجز');
 const t=document.querySelector('.tab.on').id.slice(2);go(t);
}
function setSt(id,s){db.apps.find(a=>a.id===id).st=s;save();rApps();rHome()}
function delApp(id){db.apps=db.apps.filter(a=>a.id!==id);save();rApps();rHome()}
function waRemind(id){
 const a=db.apps.find(x=>x.id===id),p=pt(a.pt);
 let n=p.phone.replace(/\D/g,'');if(n.startsWith('0'))n='964'+n.slice(1);
 const m=`مرحباً ${p.name}، نذكّرك بموعدك في عيادة المصارف (د. حذيفة الحمداني) بتاريخ ${a.date} الساعة ${a.time}. نتمنى لك السلامة.`;
 window.open(`https://wa.me/${n}?text=${encodeURIComponent(m)}`,'_blank');
}
function speak(){
 const l=db.apps.filter(a=>a.date===today()&&a.st==='محجوز').sort((a,b)=>a.time.localeCompare(b.time));
 const t=l.length?`لديك ${l.length} مواعيد اليوم. `+l.map(a=>`الساعة ${a.time} ${pt(a.pt)?.name}`).join('، '):'لا توجد مواعيد اليوم';
 const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';speechSynthesis.speak(u);
}

/* ===== مخطط الأسنان ===== */
const UP=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28],LO=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const OPS={'':['سليم',''],endo:['حشوة عصب','endo'],fill:['حشوة ضوئية','fill'],crown:['تغليف','crown'],implant:['زراعة','implant'],ext:['قلع','ext']};
function goChart(id){curPt=id;go('chart');document.querySelectorAll('nav button')[3].click()}
function rChart(){
 $('cpt').innerHTML=db.patients.map(p=>`<option value="${p.id}" ${p.id===curPt?'selected':''}>${esc(p.name)}</option>`).join('')||'<option>لا يوجد مراجعون</option>';
 curPt=$('cpt').value;const p=pt(curPt);if(!p){$('up').innerHTML=$('lo').innerHTML=$('chartLog').innerHTML='';return}
 const draw=a=>a.map(n=>`<div class="tooth ${p.teeth[n]?.op||''}" onclick="toothForm(${n})">${n}</div>`).join('');
 $('up').innerHTML=draw(UP);$('lo').innerHTML=draw(LO);
 $('chartLog').innerHTML='<b>سجل الإجراءات</b>'+(Object.entries(p.teeth).map(([n,t])=>`<div class="dm">سن ${n}: ${OPS[t.op][0]} — ${esc(t.session)} ${t.note?'— '+esc(t.note):''}</div>`).join('')||'<div class="dm">لا توجد إجراءات</div>');
}
function toothForm(n){
 const t=pt(curPt).teeth[n]||{op:'',session:'الجلسة الأولى',note:''};
 openM('السن رقم '+n,`<select id="o1" class="in">${Object.entries(OPS).map(([k,v])=>`<option value="${k}" ${k===t.op?'selected':''}>${v[0]}</option>`).join('')}</select>
 <select id="o2" class="in">${['الجلسة الأولى','الجلسة الثانية','الجلسة الثالثة','جلسة إنهاء العلاج','متابعة'].map(s=>`<option ${s===t.session?'selected':''}>${s}</option>`).join('')}</select>
 <input id="o3" class="in" placeholder="ملاحظات / قياسات (طول القناة، أبعاد الغرسة...)" value="${esc(t.note)}">
 <button class="btn p" onclick="saveTooth(${n})">حفظ</button>`);
}
function saveTooth(n){
 const p=pt(curPt),op=$('o1').value;
 if(!op)delete p.teeth[n];else p.teeth[n]={op,session:$('o2').value,note:$('o3').value};
 save();closeM();rChart();
}

/* ===== الأدوية والحساسية ===== */
const ALG={'بنسلين':['penicillin','amoxicillin','augmentin','amoxil','اموكسيسيلين','اوغمنتين','أوغمنتين'],'بروفين':['ibuprofen','brufen','بروفين'],'سلفا':['sulfa','septrin','سلفا'],'اسبرين':['aspirin','اسبرين','أسبرين']};
function allergyHit(p,drug){
 const d=drug.toLowerCase();
 return (p.allergy||'').split(/[,،]/).map(s=>s.trim().toLowerCase()).filter(Boolean).some(a=>d.includes(a)||(ALG[a]||[]).some(x=>d.includes(x)));
}
function medForm(id){
 curPt=id;const p=pt(id);
 openM('وصفة: '+p.name,`<div id="mAl" class="tag warn" style="display:none;padding:10px">⚠️ تحذير: الدواء يتعارض مع حساسية المريض المسجلة!</div>
 <input id="m1" class="in" placeholder="اسم الدواء" oninput="$('mAl').style.display=allergyHit(pt(curPt),this.value)?'block':'none'">
 <input id="m2" class="in" placeholder="الجرعة (كبسولة كل 8 ساعات)"><button class="btn p" onclick="addMed()">إضافة</button>
 <div id="mList"></div><button class="btn" onclick="printRx('${id}')">🖨 طباعة الروشتة</button>`);
 mList();
}
const mList=()=>$('mList').innerHTML=pt(curPt).meds.map((m,i)=>`<div class="row sp card"><span>℞ ${esc(m.n)} — ${esc(m.d)}</span><button class="btn d" onclick="pt(curPt).meds.splice(${i},1);save();mList()">✕</button></div>`).join('');
function addMed(){
 const n=$('m1').value.trim();if(!n)return;
 if(allergyHit(pt(curPt),n)&&!confirm('⚠️ هذا الدواء يتعارض مع حساسية المريض! هل تريد المتابعة؟'))return;
 pt(curPt).meds.push({n,d:$('m2').value});save();$('m1').value=$('m2').value='';mList();
}
function printRx(id){
 const p=pt(id);
 $('prn').innerHTML=`<div style="text-align:center;border-bottom:2px solid #000;padding-bottom:8px"><h1>عيادة المصارف</h1><p>الدكتور حذيفة الحمداني — طب وجراحة الأسنان</p></div>
 <p style="margin:12px 0"><b>المراجع:</b> ${esc(p.name)} — ${esc(p.age)} سنة — ${today()}</p>
 ${p.allergy?`<p><b>الحساسية:</b> ${esc(p.allergy)}</p>`:''}
 <h3>℞ الوصفة الطبية</h3><ol style="margin:8px 24px">${p.meds.map(m=>`<li>${esc(m.n)} — ${esc(m.d)}</li>`).join('')||'<li>—</li>'}</ol>
 <h3>الإجراءات السنية</h3><ul style="margin:8px 24px">${Object.entries(p.teeth).map(([n,t])=>`<li>سن ${n}: ${OPS[t.op][0]} (${esc(t.session)}) ${esc(t.note)}</li>`).join('')||'<li>—</li>'}</ul>
 <p style="margin-top:40px">توقيع الطبيب: ____________</p>`;
 window.print();
}

/* ===== المالية ===== */
function payForm(id){
 const p=pt(id);
 openM('دفعة: '+p.name,`<div class="dm">المتبقي: ${fm(debt(p))}</div><input id="y1" type="number" class="in" placeholder="المبلغ">
 <select id="y2" class="in"><option>كاش</option><option>بطاقة</option></select><button class="btn p" onclick="savePay('${id}')">تسجيل</button>`);
}
function savePay(id){
 const a=+$('y1').value;if(!(a>0))return toast('أدخل مبلغاً صحيحاً');
 db.pays.push({id:uid(),pt:id,amt:a,m:$('y2').value,date:today()});save();closeM();rPts();toast('تم التسجيل');
}
function rFin(){
 const s=m=>db.pays.filter(x=>x.m===m).reduce((a,b)=>a+b.amt,0);
 $('finStats').innerHTML=[['كاش',s('كاش'),'--pr'],['بطاقة',s('بطاقة'),'--bl'],['الديون',db.patients.reduce((a,p)=>a+debt(p),0),'--rd']]
  .map(x=>`<div class="card stat money" style="border-color:var(${x[2]})"><span class="dm">${x[0]}</span><h2 style="color:var(${x[2]})">${fm(x[1])}</h2></div>`).join('');
 $('finList').innerHTML=db.pays.slice().reverse().slice(0,50).map(x=>`<div class="card money"><div class="row sp"><b>${esc(pt(x.pt)?.name||'—')}</b><span class="tag ok">${fm(x.amt)}</span></div><span class="dm">${x.m} · ${x.date}</span></div>`).join('');
}

/* ===== الكادر ===== */
function rDocs(){
 $('docBox').innerHTML=db.doctors.map(d=>`<div class="card"><b>${esc(d.name)}</b><span class="dm">${esc(d.spec)}</span>${d.id!=='d1'?`<button class="btn d" onclick="delDoc('${d.id}')">حذف</button>`:''}</div>`).join('');
}
function docForm(){
 if(db.doctors.length>=10)return toast('الحد الأقصى 10 أطباء');
 openM('طبيب جديد','<input id="d1" class="in" placeholder="الاسم"><input id="d2" class="in" placeholder="الاختصاص"><button class="btn p" onclick="saveDoc()">حفظ</button>');
}
function saveDoc(){if(!$('d1').value.trim())return;db.doctors.push({id:uid(),name:$('d1').value.trim(),spec:$('d2').value});save();closeM();rDocs()}
function delDoc(id){if(db.patients.some(p=>p.doc===id)||db.apps.some(a=>a.doc===id))return toast('الطبيب مرتبط بمراجعين أو مواعيد');db.doctors=db.doctors.filter(d=>d.id!==id);save();rDocs()}

/* ===== الإعدادات والنسخ ===== */
async function chgPin(){const v=$('npin').value;if(v.length<4)return toast('4 أرقام على الأقل');db.pin=await sha(v);save();$('npin').value='';toast('تم تغيير الرمز')}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='masarif-backup-'+today()+'.json';a.click()}
function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.patients||!d.doctors)throw 0;db=d;save();toast('تمت الاستعادة');go('home')}catch(x){toast('ملف غير صالح')}};r.readAsText(f)}
function exportCsv(){
 const rows=[['الاسم','العمر','الهاتف','العنوان','الحساسية','الكلفة','المتبقي']].concat(db.patients.map(p=>[p.name,p.age,p.phone,p.address,p.allergy,role==='doc'?p.cost:'',role==='doc'?debt(p):'']));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'}));a.download='patients.csv';a.click();
}
</script>
